$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-overseer-development-machine/lessons-learned.schema.yaml
title: lessons-learned.md frontmatter
description: >-
  Schema for the cumulative lessons-learned.md at the data-root top level. The
  L-NNN lesson blocks in the body are appended by scripts/lessons.sh and are
  not validated by this JSON Schema.

type: object
additionalProperties: false
required:
  - id

properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: UUID v4.
