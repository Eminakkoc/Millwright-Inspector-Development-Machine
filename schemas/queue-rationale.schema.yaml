$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-inspector-development-machine/queue-rationale.schema.yaml
title: quest/<active-slug>/queue-rationale.md frontmatter
description: >
  Audit artifact for the stage-1.5 dependency-ordering decision. Lives at
  millwright-inspector/quest/<active-slug>/queue-rationale.md, co-located
  with the cycle's todo-list.md, summary.md, and progress.md inside the
  per-cycle subfolder. Written by the Pre-flight Handler in /mi-continue
  (Step 2B) just before progress.sh reorder so the prioritized order and
  the reasoning behind it survive a session break. Persists permanently
  under the cycle's slug subfolder once the cycle ends — the historical
  rationale is preserved as part of the task archive rather than scrubbed
  by the next /mi-run.

type: object
additionalProperties: false
required:
  - id
  - todo-list-id
  - features

properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  todo-list-id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  features:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
    description: >
      Cumulative ordered feature list across all confirmed batches (and the
      proposed order for the latest batch when status: draft). The dispatcher's
      Row A (Item 5 of the v11 progress-gap plan) requires `features -
      progress.completed` to equal `progress.queue` in order; Step 2B keeps
      these aligned by refreshing `features` whenever the latest batch flips
      from `draft` to `confirmed`. Step 2A appending a new batch must publish
      the cumulative `features` and `batch: N+1`/`status: draft` in the same
      write so the next /mi-continue routes to the draft-confirmation row.
  status:
    type: string
    enum:
      - draft
      - confirmed
    description: >
      Status of the LATEST batch only (older batches' statuses live in the body
      audit trail). Optional — missing means "confirmed" (back-compat with v10-
      and-earlier files that pre-date the multi-batch addition). The pre-flight
      dispatcher reads this to decide between Row A (auto-apply on confirmed)
      and the draft-confirmation row (route to Step 2B for confirmation).
  batch:
    type: integer
    minimum: 1
    description: >
      Latest batch number. Optional — missing means 1 (back-compat). Step 2A
      appends `## Batch <N+1>` and writes `batch: N+1` in the same operation;
      Step 2B refreshes this when flipping `status: draft → confirmed`.
  scan-mode:
    type: string
    enum:
      - journal-only
      - code-aware
    description: >
      How the latest batch's ordering was derived. `journal-only` (default) —
      the proposal came from `summary.md` cross-references and dependency
      keywords (Phase 4.1 / 4.2 of the context-optimization plan, the cheap
      path). `code-aware` — the heuristic flagged ambiguity and a fresh
      sub-agent inspected cross-feature imports (Phase 4.3, the expensive
      path). Optional — missing means `journal-only` for back-compat with
      v10-era files. Used together with `summary-md-hash` and
      `head-when-scanned` as the cache key when deciding whether to re-derive
      the ordering on a mid-cycle re-entry.
  summary-md-hash:
    type: string
    description: >
      Optional cache field. Present only when `scan-mode: code-aware`. Hex
      digest (sha-256, abbreviated) of the cycle's `summary.md` content at
      scan time. Part of the cache key; if `summary.md` changes mid-cycle
      (new batch added, edits during inspector review), the digest mismatches
      and the next code-aware scan re-derives.
  head-when-scanned:
    type: string
    pattern: "^[0-9a-f]{7,40}$"
    description: >
      Optional cache field. Present only when `scan-mode: code-aware`. Git
      SHA of HEAD at the time the sub-agent inspected the codebase. Part of
      the cache key; if HEAD moves between batches (commits landed) and the
      scan was code-aware, the cached ordering may be stale and is re-derived.
