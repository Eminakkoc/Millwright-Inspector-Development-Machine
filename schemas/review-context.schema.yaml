$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-inspector-development-machine/review-context.schema.yaml
title: workflow-stream/<feature>/implementation/review-context.md frontmatter
description: >
  Stage-6 review-loop primer. Derived snapshot composed from
  blueprints/current/requirements.md (active goals), implementation/diagrams/
  (file list), implementation/inspector-review.md (open findings snapshot),
  and progress.md (branch + base-commit). Written by /mi-review immediately
  before the brainstorming review session is invoked. Cleaned up by
  /mi-complete-workflow and /mi-abort-workflow alongside inspector-review.md
  and implementation/diagrams/.

type: object
additionalProperties: false
required:
  - id
  - feature

oneOf:
  - required: [requirements-id]
  - required: [requirements-ids]

properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  requirements-id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: UUID of the requirements.md this review-context summarizes. Re-pointed by /mi-update-blueprint via review.sh sync-refs if blueprint rotates.
  requirements-ids:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: >
      Ordered UUIDs of every finished ordinary feature's archived
      requirements.md, for a feature-test entry — which has no blueprint of
      its own and is framed against all of them rather than one. Mutually
      exclusive with `requirements-id`; ordinary features keep the singular.
      Never re-pointed by review.sh sync-refs — a feature-test entry has no
      blueprints/current/ to rotate.
  feature:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
    description: Kebab-case feature name; mirrors progress.md `active.feature`.
