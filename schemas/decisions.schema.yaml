$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-overseer-development-machine/decisions.schema.yaml
title: workflow-stream/<feature>/decisions.md frontmatter
description: >
  Feature-scoped, append-only log of verbal decisions, scope adjustments,
  and constraints captured during overseer ↔ millwright Q&A that aren't
  reflected in requirements.md, config.md, or overseer-review.md. Lives at
  the root of workflow-stream/<feature>/ (NOT inside blueprints/current/);
  excluded from history rotation by design (per docs/clear-points/plan.md
  §9.2) so it persists for the feature's lifetime and accumulates across
  blueprint regenerations. Read by mo-plan-implementation Step 3.5
  (folds into primer.md), /mo-review Step 2.5 (folds into review-context.md),
  and /mo-update-blueprint regen (folds into requirements.md Non-goals
  and config.md Overseer Additions). Never modified by consumers.

type: object
additionalProperties: false
required:
  - id
  - feature

properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: UUIDv4 — generated at first write by frontmatter.sh init.
  feature:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
    description: >
      Kebab-case feature name; mirrors the parent workflow-stream/<feature>/
      folder. Must equal active.feature in progress.md at the time the file
      was created, and must NOT change across writes (the file is feature-
      scoped — a renamed feature gets a new file, not a rewrite of this one).
