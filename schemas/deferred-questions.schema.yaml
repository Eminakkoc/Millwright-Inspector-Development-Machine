$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-inspector-development-machine/deferred-questions.schema.yaml
title: workflow-stream/<feature>/implementation/deferred-questions.md frontmatter
description: >
  Questions the stage-3 implementation chain deferred instead of blocking
  (auto-mode chain rules, templates/auto-mode-chain-rules.md). Body holds one
  `## DQ-NNN` block per question with `question`, `assumed`, `status`
  (open|answered), `answer`, `needs-finding` (true|false) and `follow-up`
  (IR id) lines; this schema validates frontmatter only. Walked through once
  at chain end; mi-continue Resume Step 6 turns needs-finding entries into
  IR findings. Lives in implementation/, so it rotates with the feature.
type: object
additionalProperties: false
required: [id, feature]
properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  feature:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
