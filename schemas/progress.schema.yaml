$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-inspector-development-machine/progress.schema.yaml
title: millwright-inspector/quest/<active-slug>/progress.md frontmatter
description: >
  Single workflow-wide state file. Tracks the queue, completed features,
  and the currently active feature's runtime state. Lives inside the
  active quest cycle's per-cycle subfolder
  (millwright-inspector/quest/<active-slug>/progress.md; the slug is
  recorded in the top-level quest/active.md pointer). Co-generated with
  todo-list.md, summary.md, and queue-rationale.md by mi-run. Replaces
  the previous flat quest/progress.md layout, the older quest/workflow-queue.md,
  and per-feature workflow-stream/<feature>/progress.md.

type: object
additionalProperties: false
required:
  - id
  - todo-list-id
  - queue
  - completed
  - active

properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

  todo-list-id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

  queue:
    type: array
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
    description: Features scheduled to run, in priority order. The active feature is NOT in this list.

  completed:
    type: array
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
    description: Features whose workflows have reached stage 8.

  active:
    description: >
      Currently running feature and its runtime state. Null between workflows
      (immediately after stage 1, and after the last feature finishes at stage 8).
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        required:
          - feature
          - branch
          - current-stage
          - sub-flow
          - execution-mode
          - planning-mode
          - review-mode
          - review-mode-suggestion
          - diagram-prompt
          - diagram-rendering
          - implementation-diagrams-skipped
          - implementation-completed
          - inspector-review-completed
          - manual-test-state
          - manual-test-failure-policy
          - worktree-path
          - git-common-dir
          - git-worktree-dir
        properties:
          feature:
            type: string
            minLength: 1
            pattern: "^[a-z0-9][a-z0-9-]*$"
            description: Kebab-case feature name; mirrors the workflow-stream/<feature>/ folder.
          branch:
            oneOf:
              - type: "null"
              - type: string
                minLength: 1
            description: >
              Git branch carrying the implementation commits. Null on stage-2 activation;
              populated at stage 3 when `/mi-plan-implementation` reads
              `## GIT BRANCH` from config.md.
          current-stage:
            type: integer
            minimum: 2
            maximum: 8
            description: >
              Active-feature stage. Only exists between stage 2 (just activated)
              and stage 8 (completed, about to be archived). Stages 0 (journal intake)
              and 1 (mi-run) are workflow-wide and implied by the presence of this file
              with active=null.
          sub-flow:
            type: string
            enum: [none, chain-in-progress, resuming, reviewing, manual-testing]
          base-commit:
            oneOf:
              - type: "null"
              - type: string
                pattern: "^[0-9a-f]{7,40}$"
            description: >
              Git SHA captured at stage 3 — defines the implementation diff range
              (base-commit..HEAD) used by review and diagram generation. The
              brainstorming chain's spec/plan files are intentionally NOT tracked
              here; mi-workflow treats those as opaque chain outputs.
          execution-mode:
            type: string
            enum: [subagent-driven, inline, none]
          planning-mode:
            type: string
            enum: [brainstorming, direct, none]
            description: >
              Stage-3 launch choice. `brainstorming` invokes the brainstorming
              Skill in an isolated session; `direct` skips the Skill and has
              the millwright implement in the main session using primer.md
              as the required first read. `none` until /mi-plan-implementation
              records the choice.
          review-mode:
            type: string
            enum: [brainstorming, direct, none]
            description: >
              Stage-6 launch choice for the review session. `brainstorming`
              invokes the brainstorming Skill (isolated session); `direct`
              has the millwright address findings in the main session using
              review-context.md + inspector-review.md as required first reads.
              `none` until /mi-review records the choice.
          review-mode-suggestion:
            type: string
            enum: [brainstorming, direct, none]
            description: >
              Hint persisted by stage 5 (`/mi-continue` Inspector Step 1.5)
              after canonicalizing findings. Computed from the scope
              distribution: `direct` when 100% of currently-open findings
              have `scope: fix`, `brainstorming` when at least one finding
              has scope ≠ fix, `none` when there are zero open findings.
              Stage 6 (`/mi-review` Step 2.6) reads this to set the default
              of the `review-mode` prompt — `direct` defaults to direct mode
              with rationale; otherwise the prompt defaults to brainstorming.
              Distinct from `review-mode`, which records the inspector's
              actual choice. Initialized to `none` by progress.sh activate
              and reset; set by stage 5; cleared back to `none` at the next
              feature's activation.
          diagram-prompt:
            type: string
            enum: [prompt, auto]
            description: >
              Per-feature setting for the per-event diagram prompt at stages
              2 and 4. `prompt` (default) — ask the inspector before each
              diagram-generation event. `auto` — skip the prompt and proceed
              to generation directly. The inspector can opt into `auto` once
              per feature workflow when answering the diagram prompt; the
              field resets to `prompt` at the next feature's `activate`.
              Quest-cycle-wide preferences would belong outside `active.*`
              (e.g., a top-level field) — that is intentionally out of
              scope here.
          diagram-rendering:
            type: string
            enum: [never, on-request]
            description: >
              Per-feature setting controlling whether SVG/PNG renders are
              produced alongside the `.puml` source. `never` (default) —
              `.puml`-only output; SVG/PNG are NOT generated. `on-request`
              — SVG/PNG are generated when an explicit request is made
              (e.g., the inspector asks during the per-event prompt or via
              a follow-up command). Even on `on-request`, rendering happens
              only on explicit ask; it is never automatic. Stays `never`
              for the entire feature workflow unless the inspector changes
              it; resets to `never` at the next feature's `activate`.
              Out of scope for the workflow plan: deciding *when* SVG/PNG
              are useful (e.g., for CI / visual QA). The field reserves
              the lever; specific rendering call sites stay deferred.
          implementation-diagrams-skipped:
            type: boolean
            description: >
              True when the inspector answered `n` to stage 4's per-event
              diagram prompt. Records that no `.puml` files exist under
              `implementation/diagrams/` by design (not because of a partial
              run). Stage 5's inspector-review handoff and Stage 7's
              diagram-refresh prompt branch on this marker so they don't
              point the inspector at a non-existent folder. The directory
              MUST NOT exist when this is true — `/mi-generate-implementation-diagrams.md`
              removes any pre-existing directory BEFORE setting the marker
              to preserve the invariant under crash. Cleared back to false
              when a subsequent stage-4 `y`/`auto` or stage-7 generation
              succeeds. Resets to false at the next feature's `activate`.
          implementation-completed:
            type: boolean
          inspector-review-completed:
            type: boolean
          manual-test-state:
            type: string
            enum: [none, running, complete, skipped]
            description: >
              Coarse lifecycle marker for the stage-5 manual-test phase.
                - `none` — initial value at activate. Also the state when a
                  plan has been generated but the inspector has deferred
                  running it (file exists at
                  workflow-stream/<feature>/test/manual-test-plan.md but
                  the per-scenario loop has not started). The "plan
                  exists" signal lives in the file's existence, not in this
                  enum — skill preconditions distinguish the two `none`
                  cases by checking file presence.
                - `running` — per-scenario loop is active OR paused mid-run.
                  Paired with sub-flow=manual-testing for dispatcher routing.
                  Pause persists state as `running` (not a new value) and
                  writes the current scenario id to manual-test-results.md
                  frontmatter.
                - `complete` — loop finished (pass/fail counts live in
                  manual-test-results.md frontmatter).
                - `skipped` — inspector declined the manual-test phase entirely
                  at the stage-5 plan prompt (no plan generated, no scenarios
                  run). Reserved for "decline the phase" only. Resets to
                  `none` at next feature's activate.

              `/mi-manual-test-run --finalize-skipped` does NOT set this state.
              Bulk-skipping remaining scenarios from a paused state is
              treated as a *completed run with skipped count* — terminal
              state is `complete`, with the skipped count tracked in
              manual-test-results.md frontmatter. `skipped` means "phase
              declined"; `complete` means "run reached its terminal state".
          manual-test-failure-policy:
            type: string
            enum: [auto-seed, manual, none]
            description: >
              Records the inspector's answer to the auto-seed prompt at the
              end of a manual-test run. Set by `mi-manual-test-run` (the
              single owner of seeding for manual-test results).
                - `none` — initial value; also the value when the run is
                  `skipped` or when no failures occurred.
                - `auto-seed` — inspector chose to run the auto-seed loop.
                  Cycle-level intent/outcome marker, NOT a guarantee that
                  every failed scenario ended with a seeded IR. Individual
                  failures may remain unseeded when the inspector picks `skip`
                  on a closed-IR or orphan-family prompt, or when a helper
                  hard error aborts the loop. The per-scenario `Seeded:`
                  cache in the results file is the source of truth for how
                  many failures currently have a successful seed action.
                  Seeded failures are written as canonical `### IR-NNN`
                  blocks (with `- source: manual-test` and `- seed-id: ...`
                  fields) into inspector-review.md under
                  `## Implementation Review`.
                - `manual` — inspector answered `n`; inspector-review.md was
                  not modified by the run; the inspector authors any
                  findings themselves.
              The Inspector Handler at commands/mi-continue.md (stage 5)
              reads this field for its summary line ONLY — it must not
              auto-seed, reopen, reclassify, or rewrite manual-test seeded
              IR blocks based on this value. Existing canonicalization of
              inspector-authored free-form review text remains outside this
              invariant.
          manual-test-env-mode:
            type: string
            enum: [guided, interactive, autonomous]
            description: >
              Stage-5 manual-test execution mode. Controls how
              `/mi-manual-test-run` brings the environment up (Step 2) and who
              drives the per-scenario verdict loop (Step 3). Two independent
              axes — who starts the services, and who judges each scenario —
              which these three values combine as follows:
                - `guided` (the `y` answer at the plan prompt) — the millwright
                  brings the environment up itself (same machinery as
                  `autonomous`), then walks the INSPECTOR through the plan one
                  scenario at a time: a brief plain-language explanation (≤ 2
                  sentences), a concrete example, and exactly what to do — then
                  waits for the inspector's `pass`/`fail`/`skip`/`pause`
                  verdict before moving on. Verdicts are the inspector's, never
                  self-determined. The inspector may also ask for notes or extra
                  checks to be recorded into manual-test-results.md mid-walk.
                - `interactive` — the runner renders the plan's Prerequisites +
                  What-to-run commands to the inspector and waits for the
                  inspector to run the services and reply `ready`/`skip-env`,
                  then renders each scenario and waits for the inspector's
                  `pass`/`fail`/`skip`/`pause` verdict. Reachable via
                  `/mi-manual-test-run --interactive-env`; also the
                  backward-compatible default for a missing/null value.
                - `autonomous` — the runner brings the environment up itself
                  (runs the plan's What-to-run commands from the resolved
                  RUN_ROOT — long-running services in the background, one-shot
                  bootstrap in the foreground — and probes readiness) AND then
                  performs every scenario itself, self-determining each
                  `pass`/`fail`/`skip` verdict WITHOUT asking the inspector to
                  run anything (there is no `pause`). A scenario it cannot
                  verify autonomously is recorded `skip` with a reason, never a
                  fabricated pass. On any bring-up failure it stops and hands
                  control back to the inspector rather than testing against a
                  half-up environment.
              Set by `/mi-manual-test-plan` Step 7 (`y` → guided,
              `y-autonomous` → autonomous) and overridable via
              `/mi-manual-test-run`'s `--guided-env` / `--autonomous-env` /
              `--interactive-env` flags. Also set to `guided` by
              `/mi-manual-test-run --rerun-guided`, the post-autonomous re-run
              path that lets the inspector walk a plan themselves after a
              hands-off run already finished it.
              `/mi-manual-test-plan` Step 3.5 (forced regeneration) resets the
              field to `guided` — the mode a later bare `/mi-manual-test-run`
              then uses on the deferred path, matching what `y` would have
              selected. A **missing** value reading as `interactive` is a
              compatibility rule for cycles predating the field, not a chosen
              default; on a fresh run with no persisted value and no flag, the
              runner asks which mode to use instead of assuming.
              Persisted in `active.*` so the mode survives pause/resume
              (`/mi-continue`'s Manual-Test-Resume Handler re-fires the runner
              WITHOUT invocation flags — the persisted field is the only place
              the choice can be recovered from). Optional — a missing/null
              value means `interactive` (backward-compatible with in-flight
              cycles predating this field). Resets to the interactive default
              at the next feature's `activate` (the field is simply absent on a
              fresh active block).
          drift-check-completed:
            type: boolean
            description: >
              True once the Stage-4 drift prompt has been answered (either
              "continue" or a reason fed to /mi-update-blueprint). Optional —
              missing means false. Used by the Resume Handler's Step 0 probe
              to skip re-prompting after a session break that lost the marker
              write but completed the underlying rotation. /mi-abort-workflow's
              reset intentionally drops this field so the next stage-3 entry
              starts with a fresh state.
          history-baseline-version:
            oneOf:
              - type: "null"
              - type: integer
                minimum: 0
            description: >
              Highest blueprints/history/v[N] index for active.feature at
              stage-3 entry. Used by the Resume Handler's drift-completion
              probe to distinguish this-cycle rotations from prior-cycle
              rotations. Optional — missing/null means "unknown" (the probe
              treats unknown specially: it captures the current finalized
              version and disables the probe for that invocation rather than
              defaulting to 0, which would mistake old spec-update history for
              this-cycle drift). Captured by /mi-plan-implementation alongside
              base-commit on first stage-3 entry; preserved across re-entries
              (the re-entry guard skips Step 3 entirely). /mi-abort-workflow's
              reset intentionally drops this field.
          clear-recommendations:
            type: array
            items:
              type: string
              enum: [stage-2-to-3, stage-5-to-6]
            uniqueItems: true
            description: >
              Within-feature stage-transition identifiers the millwright has
              already suggested a `/clear` for in this cycle's active feature.
              Optional — missing/empty means "no clears recommended yet."
              Read by `progress.sh has-clear-recommendation` to decide whether
              the corresponding gate has already fired (so it doesn't re-prompt
              on inspector re-entry). Mutated by `progress.sh
              add-clear-recommendation` (idempotent — adding an already-present
              identifier is a no-op). The feature-boundary gate
              (`stage-8-to-2`) does NOT use this field — its non-replaying
              behavior is structural (`active=null` + queue non-empty happens
              once per transition by construction). /mi-abort-workflow drops
              this field as part of its reset, so the next stage-3 entry on
              the same feature re-fires the gate.
          worktree-path:
            type: string
            minLength: 1
            description: >
              Absolute filesystem path of the working tree that activated this
              feature (the value of `pwd` at the time `progress.sh activate`
              ran). State-mutating commands compare the current `pwd` against
              this field and refuse if they don't match — the guard prevents
              two git worktrees pointing at the same data_root from clobbering
              each other's active block. Captured once at stage 2; never
              rewritten thereafter.
          git-common-dir:
            type: string
            minLength: 1
            description: >
              Absolute path of the shared git directory (`git rev-parse
              --git-common-dir`) for the activating worktree. Common across
              every worktree of the same repository. Used together with
              `git-worktree-dir` to identify the exact worktree that owns the
              active cycle.
          git-worktree-dir:
            type: string
            minLength: 1
            description: >
              Absolute path of the per-worktree git directory (`git rev-parse
              --git-dir`). For the main worktree this equals
              `git-common-dir`; for additional `git worktree add` checkouts
              it lives under `<common-dir>/worktrees/<name>/`. Distinguishes
              sibling worktrees of the same repository.
          activation-id:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
            description: >
              UUIDv4 minted at activate time and re-minted at reset.
              Cross-cycle discriminator for the manual-test sub-flow's
              results-rotation guard (see docs/manual-testing-folder/plan.md
              § 4.3). Optional — in-flight cycles activated before this
              field was introduced will be missing it; consumers must
              handle the missing value by treating it as "unknown cycle"
              (the guard treats missing/non-matching the same — rotate).
              Backfilled lazily by /mi-manual-test-plan Step 1 on first
              run after the change ships. Immutable after activate
              (progress.sh set / advance-to refuse rewrites), with one
              narrow exception: a missing → set transition is allowed
              (the backfill path).
