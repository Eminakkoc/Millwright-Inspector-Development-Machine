$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-inspector-development-machine/manual-test-plan.schema.yaml
title: workflow-stream/<feature>/test/manual-test-plan.md frontmatter
description: >
  Stage-5 manual-test plan generated by /mi-manual-test-plan. Body is free-form
  markdown organized as `## 1. Prerequisites`, `## 2. What to run`, and
  `## 3. Test scenarios`; this schema validates frontmatter only. Plan files
  rotate into manual-test-plan.history/<UTC-timestamp>/ when the inspector
  regenerates (`--force` or direct `y` on the existing-plan prompt).

type: object
additionalProperties: false
required:
  - id
  - seed-family-id
  - feature
  - generated-from-base-commit
  - generated-from-head
  - generated-against-run-root
  - generated-in-activation
  - requirements-id

properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: >
      Per-render plan revision id (UUIDv4). Generated fresh on every render,
      including `--force` re-renders. Distinct from `seed-family-id` — `id`
      tracks the plan document, `seed-family-id` tracks the seeded IR family.
  seed-family-id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: >
      Stable manual-test seed-family namespace. Preserved across
      `/mi-manual-test-plan --force` re-renders so prior auto-seeded IR
      families remain visible to the new run's seed lookup. Reset only when
      the inspector explicitly passes `--new-seed-family`. The seed-id of
      every auto-seeded IR is `manual-test:<seed-family-id>:<scenario-id>`
      (or `:r<N>` for regressions).
  feature:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
  generated-from-base-commit:
    type: string
    pattern: "^[0-9a-f]{7,40}$"
    description: Base commit at the time the plan was written. Carried over from progress.md `active.base-commit`.
  generated-from-head:
    type: string
    pattern: "^[0-9a-f]{7,40}$"
    description: HEAD at the time the plan was written.
  generated-against-run-root:
    type: string
    minLength: 1
    description: >
      Absolute worktree path that was inlined into the `## 2. What to run`
      commands at render time (the value of `progress.sh get worktree-path`).
      The runner (/mi-manual-test-run) compares this to the live worktree
      path at run time and refuses with a worktree-drift diagnostic on
      mismatch (the worktree was moved between plan generation and run).
  generated-in-activation:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: >
      UUIDv4 of the `progress.md.active.activation-id` in effect when this
      plan was rendered. Read by /mi-manual-test-plan Step 1 and
      /mi-manual-test-run Branch A pre-normalization as the cross-cycle
      discriminator that decides whether a surviving manual-test-results.md
      belongs to the current activation or a prior one. See
      docs/manual-testing-folder/plan.md § 4.3 for the full mechanism.
  requirements-id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: UUID of the requirements.md this plan was framed against.
