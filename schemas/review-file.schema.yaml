$schema: "http://json-schema.org/draft-07/schema#"
$id: millwright-inspector-development-machine/review-file.schema.yaml
title: inspector-review.md frontmatter
description: Schema for inspector-review.md. Finding blocks in the body are validated structurally by scripts/internal/validate-frontmatter.sh rather than by this JSON Schema.

type: object
additionalProperties: false
required:
  - id

oneOf:
  - required: [requirements-id]
  - required: [requirements-ids]

properties:
  id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  requirements-id:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: UUID of the requirements.md this review was framed against.
  requirements-ids:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    description: >
      Ordered UUIDs of every finished ordinary feature's archived
      requirements.md, for a feature-test entry — which has no blueprint of
      its own and is framed against all of them rather than one. Mutually
      exclusive with `requirements-id`; ordinary features keep the singular.
